<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iconos Copilot 2 — arroba.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{ --red:#E8001D; --red-deep:#8E0016; --red-bright:#FF2A45; --gold:#FFC24A;
    --bg:#FAFAF8; --surface:#FFFFFF; --border:#E8E8E2; --text:#0C0C0E; --muted:#636360; --subtle:#ADADAA; }
  [data-dark]{ --bg:#0C0C0E; --surface:#16161A; --border:#2A2A2E; --text:#FAFAF8; --muted:#ADADAA; --subtle:#6B6B68; }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:48px 28px 90px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:15px;color:var(--muted);margin-top:6px;max-width:640px;line-height:1.55}
  .toggle{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:15px;flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .stage{height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;cursor:pointer;perspective:700px}
  .num{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
  .name{font-size:16px;font-weight:700;margin-bottom:5px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .hint{display:inline-flex;align-items:center;gap:7px;margin-top:26px;font-size:12.5px;color:var(--subtle);background:var(--surface);border:1px solid var(--border);padding:7px 14px;border-radius:999px}
  .hint b{color:var(--red)}

  /* 7 · Gota / blob orgánico */
  .i7{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
  .stage:hover .i7{transform:translateY(-5px) rotate(-6deg)}
  .i7 .drop{transition:filter .3s}
  .stage:hover .i7 .drop{filter:drop-shadow(0 10px 18px rgba(232,0,29,.45))}

  /* 8 · @ tipográfico pesado con extrusión lateral */
  .i8{transition:transform .35s}
  .stage:hover .i8{transform:translateX(-3px) translateY(-3px)}
  .i8 .ext{transition:opacity .3s}
  .stage:hover .i8 .ext{opacity:1}

  /* 9 · Espiral de puntos (datos) */
  .i9 .dot{transition:transform .4s, fill .3s}
  .stage:hover .i9{animation:rot9 8s linear infinite}
  @keyframes rot9{to{transform:rotate(360deg)}}
  .i9{transform-origin:center}

  /* 10 · Moneda / token metálico */
  .i10{transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .stage:hover .i10{transform:rotateY(180deg)}
  .i10 .coin{transform-style:preserve-3d}

  /* 11 · @ minimal mono-línea con nodo */
  .i11 .node{transform-origin:center;transition:transform .3s}
  .stage:hover .i11 .node{transform:scale(1.35)}
  .i11 .halo{opacity:0;transition:opacity .35s}
  .stage:hover .i11 .halo{opacity:1;animation:pulse11 1.5s ease-out infinite}
  @keyframes pulse11{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}

  /* 12 · Cinta degradada doble (interlock) */
  .i12{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
  .stage:hover .i12{transform:rotate(8deg) scale(1.05)}
  .i12 .b{transition:opacity .3s}
  .stage:hover .i12 .b{opacity:1}

  /* 13 · Cuadrado app-icon con @ recortado (hueco) */
  .i13{transition:transform .35s, box-shadow .35s;border-radius:20px}
  .stage:hover .i13{transform:translateY(-5px) scale(1.04)}

  /* 14 · @ pixel / mosaico */
  .i14 rect{transition:opacity .25s, transform .25s}
  .stage:hover .i14 .px{animation:blink14 1.2s steps(1) infinite}
  @keyframes blink14{50%{opacity:.45}}

  /* 15 · Onda / signal @ */
  .i15{transition:transform .3s}
  .stage:hover .i15{transform:scale(1.05)}
  .i15 .wv{opacity:0;transition:opacity .3s}
  .stage:hover .i15 .wv{opacity:1;animation:wave15 1.4s ease-out infinite}
  @keyframes wave15{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.7);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Iconos del copilot · tanda 2</h1>
      <p class="sub">Nueve construcciones distintas de la «@», en rojo arroba con volumen y profundidad. Pasa el ratón para ver el efecto. Dime el número que te gusta (o combinaciones).</p>
    </div>
    <button class="toggle" id="tg" title="Tema">◑</button>
  </div>
  <div class="grid" id="grid"></div>
  <div style="text-align:center"><span class="hint">Pasa el ratón sobre cada icono · <b>hover</b></span></div>
</div>

<script>
function defs(id){
  return '<defs>'+
    '<linearGradient id="g'+id+'" x1="6" y1="3" x2="30" y2="33" gradientUnits="userSpaceOnUse"><stop stop-color="#FF2A45"/><stop offset=".55" stop-color="#E8001D"/><stop offset="1" stop-color="#8E0016"/></linearGradient>'+
    '<radialGradient id="sph'+id+'" cx="38%" cy="30%" r="78%"><stop stop-color="#FF6273"/><stop offset="46%" stop-color="#E8001D"/><stop offset="100%" stop-color="#7E0014"/></radialGradient>'+
    '<linearGradient id="met'+id+'" x1="0" y1="0" x2="0" y2="36"><stop stop-color="#FF4258"/><stop offset=".5" stop-color="#E8001D"/><stop offset="1" stop-color="#9E0018"/></linearGradient>'+
  '</defs>';
}
var AT='<circle cx="18" cy="18" r="4.7"/><path d="M22.7 13.6 V20.2 C22.7 22.7 24.6 23.6 26.8 22.5"/><path d="M26.9 11.9 A11 11 0 1 0 28.1 24.6"/>';

var icons=[
 {n:'07',name:'Gota orgánica',desc:'@ blanco sobre una gota roja con brillo. En hover se inclina y proyecta sombra de color.',
  svg:'<div class="i7"><svg class="drop" width="76" height="76" viewBox="0 0 36 36" fill="none">'+defs(7)+
    '<path d="M18 2 C25 9 31 13 31 21 A13 13 0 1 1 5 21 C5 13 11 9 18 2 Z" fill="url(#sph7)"/>'+
    '<ellipse cx="14" cy="12" rx="5" ry="3.4" fill="#fff" opacity=".3"/>'+
    '<g stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1)">'+AT+'</g>'+
  '</svg></div>'},

 {n:'08',name:'Tipográfico extruido',desc:'«@» de peso alto con extrusión lateral sólida. Sensación de letra 3D maciza.',
  svg:'<div class="i8"><svg width="78" height="78" viewBox="0 0 36 36" fill="none">'+defs(8)+
    '<g class="ext" stroke="#8E0016" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(2.2 2.2)" opacity=".55">'+AT+'</g>'+
    '<g stroke="url(#g8)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
  '</svg></div>'},

 {n:'09',name:'Espiral de datos',desc:'La «@» formada por puntos que orbitan. En hover gira lentamente (inteligencia activa).',
  svg:'<div class="i9"><svg width="76" height="76" viewBox="0 0 36 36" fill="none">'+defs(9)+(function(){
    var s='';var pts=[[18,18,4.7]];
    // inner ring dots
    for(var a=0;a<8;a++){var r=18+(-90+a*45)*Math.PI/180;s+='<circle class="dot" cx="'+(18+4.7*Math.cos(a*0.785)).toFixed(1)+'" cy="'+(18+4.7*Math.sin(a*0.785)).toFixed(1)+'" r="1.15" fill="url(#g9)"/>';}
    // outer arc dots (open at right)
    for(var b=0;b<14;b++){var ang=(-200+b*22)*Math.PI/180; s+='<circle class="dot" cx="'+(18+11*Math.cos(ang)).toFixed(1)+'" cy="'+(18+11*Math.sin(ang)).toFixed(1)+'" r="'+(1.5-b*0.02).toFixed(2)+'" fill="url(#g9)"/>';}
    // tail dots
    s+='<circle class="dot" cx="22.7" cy="15" r="1.3" fill="url(#g9)"/><circle class="dot" cx="22.7" cy="19" r="1.3" fill="url(#g9)"/><circle class="dot" cx="24.5" cy="22" r="1.2" fill="url(#g9)"/>';
    return s;})()+
  '</svg></div>'},

 {n:'10',name:'Token metálico',desc:'Moneda roja con «@» en relieve. En hover voltea como una moneda (flip 3D).',
  svg:'<div class="i10" style="width:74px;height:74px"><div class="coin" style="width:74px;height:74px;border-radius:50%;background:linear-gradient(145deg,#FF4258,#9E0018);box-shadow:0 8px 18px rgba(232,0,29,.4), inset 0 2px 5px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center">'+
    '<svg width="44" height="44" viewBox="0 0 36 36" fill="none"><g stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".95">'+AT+'</g></svg>'+
  '</div></div>'},

 {n:'11',name:'Mono-línea + nodo',desc:'Trazo fino y minimalista con un nodo central. En hover el nodo late con halo.',
  svg:'<div class="i11"><svg width="76" height="76" viewBox="0 0 36 36" fill="none">'+defs(11)+
    '<g stroke="url(#g11)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22.7 13.6 V20.2 C22.7 22.7 24.6 23.6 26.8 22.5"/><path d="M26.9 11.9 A11 11 0 1 0 28.1 24.6"/></g>'+
    '<circle class="halo" cx="18" cy="18" r="6" fill="#E8001D" opacity=".25"/>'+
    '<circle class="node" cx="18" cy="18" r="3.4" fill="url(#g11)"/>'+
  '</svg></div>'},

 {n:'12',name:'Cinta interlock',desc:'Doble cinta con degradado que se entrelaza. En hover gira y aparece la segunda banda.',
  svg:'<div class="i12"><svg width="76" height="76" viewBox="0 0 36 36" fill="none">'+defs(12)+
    '<g stroke="url(#g12)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
    '<g class="b" stroke="#FFD56A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0">'+AT+'</g>'+
  '</svg></div>'},

 {n:'13',name:'App-icon (hueco)',desc:'Cuadrado rojo degradado con la «@» recortada (hueco al fondo). Estilo icono de app.',
  svg:'<div class="i13" style="width:74px;height:74px;background:linear-gradient(145deg,#FF3147,#B0001A);box-shadow:0 8px 20px rgba(232,0,29,.35), inset 0 2px 5px rgba(255,255,255,.3)">'+
    '<svg width="74" height="74" viewBox="0 0 36 36" fill="none"><defs><mask id="m13"><rect width="36" height="36" fill="#fff"/><g stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g></mask></defs>'+
    '<rect width="36" height="36" fill="transparent"/></svg></div>'},

 {n:'14',name:'Mosaico pixel',desc:'«@» construida con teselas cuadradas. En hover parpadean (señal de datos).',
  svg:'<div class="i14"><svg width="74" height="74" viewBox="0 0 36 36" fill="none">'+defs(14)+(function(){
    // build @ from a small pixel grid
    var grid=[
    "..XXXX..",
    ".X....X.",
    "X..XX..X",
    "X.X..X.X",
    "X.X..X.X",
    "X..XXXXX",
    ".X......",
    "..XXXX.."];
    var s='';var cell=3.4, ox=5, oy=5;
    for(var y=0;y<grid.length;y++)for(var x=0;x<8;x++){ if(grid[y][x]==='X'){ s+='<rect class="px" x="'+(ox+x*cell).toFixed(1)+'" y="'+(oy+y*cell).toFixed(1)+'" width="'+(cell-0.7)+'" height="'+(cell-0.7)+'" rx="0.6" fill="url(#g14)"/>'; } }
    return s;})()+
  '</svg></div>'},

 {n:'15',name:'Señal / onda',desc:'@ que emite ondas concéntricas. En hover propaga una señal (inteligencia en vivo).',
  svg:'<div class="i15"><svg width="78" height="78" viewBox="0 0 36 36" fill="none">'+defs(15)+
    '<circle class="wv" cx="18" cy="18" r="13" stroke="#E8001D" stroke-width="1.4" opacity=".5"/>'+
    '<g stroke="url(#g15)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
  '</svg></div>'},
];

var grid=document.getElementById('grid');
grid.innerHTML=icons.map(function(i){
  return '<div class="card"><div class="stage">'+i.svg+'</div><div class="num">Opción '+i.n+'</div><div class="name">'+i.name+'</div><div class="desc">'+i.desc+'</div></div>';
}).join('');
document.getElementById('tg').onclick=function(){document.documentElement.toggleAttribute('data-dark');};
</script>
</body>
</html>
