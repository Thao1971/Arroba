<style>

const Icon = ({ name, size=16, color='currentColor', sw=1.5, style={} }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none"
    stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
    style={style} dangerouslySetInnerHTML={{ __html: IP[name] || '' }} />
);

const Badge = ({ estado, label }) => {
  const cfg = {
    'nuevo':         { c: BLUE,   bg: `${BLUE}/0.12`.replace('/','/ ') },
    'nda':           { c: YELLOW, bg: `${YELLOW}/0.14`.replace('/','/ ') },
    'due-diligence': { c: YELLOW, bg: `${YELLOW}/0.14`.replace('/','/ ') },
    'loi':           { c: GREEN,  bg: `${GREEN}/0.12`.replace('/','/ ') },
    'cerrado':       { c: GREEN,  bg: `${GREEN}/0.15`.replace('/','/ ') },
    'pausado':       { c: 'var(--text-3)', bg: 'var(--surface-3)' },
    'rechazado':     { c: ACCENT, bg: `${ACCENT}/0.12`.replace('/','/ ') },
  }[estado] || { c: 'var(--text-3)', bg: 'var(--surface-3)' };

  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:5,
      fontSize:10, fontWeight:600, letterSpacing:'0.04em',
      padding:'3px 9px', borderRadius:'var(--radius-full)',
      color: cfg.c,
      background: estado === 'nuevo' ? 'oklch(0.64 0.11 232 / 0.12)'
        : estado === 'nda' ? 'oklch(0.78 0.13 85 / 0.14)'
        : estado === 'due-diligence' ? 'oklch(0.78 0.13 85 / 0.14)'
        : estado === 'loi' ? 'oklch(0.67 0.13 150 / 0.12)'
        : estado === 'cerrado' ? 'oklch(0.67 0.13 150 / 0.15)'
        : estado === 'rechazado' ? 'oklch(0.58 0.20 22 / 0.12)'
        : 'var(--surface-3)',
    }}>
      <span style={{ width:5, height:5, borderRadius:'50%', background:'currentColor', display:'inline-block', flexShrink:0 }} />
      {label}
    </span>
  );
};

const DEALS = [
  { id:1, nombre:'Agencia Nómada',  tipo:['Performance','SEO'],           valoracion:'€2.4M', valoracionNum:2400000, mrr:'€120k', ebitda:'+38%', equipo:14, nps:72,  estado:'due-diligence', estadoLabel:'Due Diligence', ciudad:'Madrid',    fundacion:2015, descripcion:'Agencia de performance con fuerte especialización en SEO técnico y Paid Search. Cartera diversificada de 40+ clientes recurrentes con ticket medio de €3k/mes.',

    docs:[{nombre:'NDA',estado:'firmado',fecha:'2 mar 2026'},{nombre:'Info Memo',estado:'disponible',fecha:'15 mar 2026'},{nombre:'Modelo Financiero',estado:'disponible',fecha:'28 mar 2026'},{nombre:'LOI',estado:'enviado',fecha:'10 may 2026'}] },
  { id:4, nombre:'Mediacloud',       tipo:['Paid Media','Programática'],   valoracion:'€890k', valoracionNum:890000,  mrr:'€48k',  ebitda:'+21%', equipo:6,  nps:59,  estado:'nuevo',         estadoLabel:'Nuevo',         ciudad:'Valencia',  fundacion:2020, descripcion:'Especialistas en compra programática, display y video. Equipo de 6 personas con alta capacidad de escala técnica.',
    docs:[{nombre:'NDA',estado:'pendiente',fecha:'—'}] },
  { id:5, nombre:'Kreativa',         tipo:['Social','Content'],            valoracion:'€1.1M', valoracionNum:1100000, mrr:'€55k',  ebitda:'+18%', equipo:11, nps:75,  estado:'pausado',       estadoLabel:'En pausa',      ciudad:'Sevilla',   fundacion:2017, descripcion:'Agencia de contenidos y social con comunidades de 5M+ seguidores. Alta retención de clientes y modelo retainer estable.',

Object.assign(window, { Icon, Badge, DEALS, ACCENT, BLUE, GREEN, YELLOW });

<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="DealFlow.jsx"></script>
<script type="text/babel" src="DealDetail.jsx"></script>

<script type="text/babel">
const App = () => {
  const [screen, setScreen] = React.useState('dashboard');
  const [deal, setDeal] = React.useState(null);

  const go = (s, d=null) => { setScreen(s); if (d) setDeal(d); };

  const screens = {
    dashboard: <Dashboard go={go} />,
    dealflow:  <DealFlow go={go} />,
    'deal-detail': <DealDetail deal={deal} go={go} />,
  };

  const placeholder = (label) => (
    <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-3)', fontFamily:'var(--font-mono)', fontSize:13 }}>
      {label} — próximamente
    </div>
  );

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar screen={screen} go={go} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        {screens[screen] || placeholder(screen)}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
