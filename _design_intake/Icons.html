  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --border: #E8E8E2; --border-strong: #D4D4CC;

      --bg: #0C0C0E; --surface: #1A1A18; --surface-2: #242422;

      --text: #FAFAF8; --text-muted: #ADADAA; --text-subtle: #636360;

    input { font-family: inherit; }

    ['watchlist',    'Watchlist',    '<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>'],
    ['match',        'Match',        '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'],
    ['location',     'Ubicación',    '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>'],

  ],
  'Datos & Finanzas': [
    ['chart-bar',    'Chart Bar',    '<line x1="2" y1="20" x2="22" y2="20"/><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="4" width="4" height="16"/>'],
    ['chart-line',   'Chart Line',   '<polyline points="3,17 8,12 12,14.5 17,9 21,11"/><line x1="2" y1="20" x2="22" y2="20"/><line x1="2" y1="4" x2="2" y2="20"/>'],
    ['trending-up',  'Trending Up',  '<polyline points="23,6 13.5,15.5 8.5,10.5 1,18"/><polyline points="17,6 23,6 23,12"/>'],
    ['trending-down','Trending Down','<polyline points="23,18 13.5,8.5 8.5,13.5 1,6"/><polyline points="17,18 23,18 23,12"/>'],
    ['euro',         'Euro',         '<path d="M18 6.5a7 7 0 100 11"/><line x1="4" y1="9.5" x2="14" y2="9.5"/><line x1="4" y1="14.5" x2="14" y2="14.5"/>'],
    ['percentage',   'Porcentaje',   '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>'],
    ['layers',       'Sectores',     '<polygon points="12,2 2,7 12,12 22,7"/><polyline points="2,17 12,22 22,17"/><polyline points="2,12 12,17 22,12"/>'],
    ['report',       'Informe',      '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="12" x2="16" y2="12"/><polyline points="8,16 10,14 12,16 14,13 16,15"/>'],
    ['target',       'Objetivo',     '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.5"/>'],
    ['valuation',    'Valoración',   '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6"/>'],
  ],
};

/* ── Icon component ─────────────────────────────────────────── */
function Icon({ paths, size = 24, strokeWidth }) {
  const sw = strokeWidth || (size <= 16 ? 1.5 : size >= 32 ? 2 : 1.75);
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      dangerouslySetInnerHTML={{ __html: paths }}
    />
  );
}

/* ── Icon card ──────────────────────────────────────────────── */
function IconCard({ id, label, paths, size, view }) {
  const [state, setState] = React.useState('idle'); // idle | copied

  const handleClick = () => {
    const sw = size <= 16 ? 1.5 : size >= 32 ? 2 : 1.75;
    const jsx = `<svg width={${size}} height={${size}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={${sw}} strokeLinecap="round" strokeLinejoin="round">\n  ${paths}\n</svg>`;
    navigator.clipboard?.writeText(jsx);
    setState('copied');
    setTimeout(() => setState('idle'), 1400);
  };

  if (view === 'list') {
    return (
      <div onClick={handleClick} title="Click to copy JSX" style={{
        display: 'flex', alignItems: 'center', gap: 14, padding: '10px 16px',
        cursor: 'pointer', borderRadius: 8, border: '1px solid transparent',
        transition: 'background .12s, border-color .12s',
      }}
      onMouseEnter={e => { e.currentTarget.style.background = 'var(--surface-2)'; e.currentTarget.style.borderColor = 'var(--border)'; }}
      onMouseLeave={e => { e.currentTarget.style.background = ''; e.currentTarget.style.borderColor = 'transparent'; }}
      >
        <div style={{ color: state === 'copied' ? '#E8001D' : 'var(--text)', flexShrink: 0, width: 28, display: 'flex', justifyContent: 'center' }}>
          <Icon paths={paths} size={20} />
        </div>
        <span style={{ fontSize: 13, color: 'var(--text)', flex: 1 }}>{label}</span>
        <span style={{ fontSize: 10, color: 'var(--text-subtle)', fontFamily: 'monospace' }}>{id}</span>
        {state === 'copied' && <span style={{ fontSize: 11, color: '#E8001D', fontWeight: 600 }}>Copied</span>}
      </div>
    );
  }

  return (
    <div onClick={handleClick} title="Click to copy JSX" style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      gap: 10, padding: '20px 8px', borderRadius: 10, cursor: 'pointer',
      border: `1px solid ${state === 'copied' ? '#E8001D' : 'var(--border)'}`,
      background: state === 'copied' ? 'rgba(232,0,29,.04)' : 'var(--surface)',
      transition: 'border-color .12s, background .12s, transform .1s',
      userSelect: 'none',
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor = state === 'copied' ? '#E8001D' : '#ADADAA'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor = state === 'copied' ? '#E8001D' : 'var(--border)'; e.currentTarget.style.transform = ''; }}
    >
      <div style={{ color: state === 'copied' ? '#E8001D' : 'var(--text)' }}>
        <Icon paths={paths} size={size} />
      </div>
      <span style={{ fontSize: 11, color: state === 'copied' ? '#E8001D' : 'var(--text-subtle)', fontWeight: state === 'copied' ? 600 : 400, textAlign: 'center', lineHeight: 1.3, maxWidth: '100%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', padding: '0 4px' }}>
        {state === 'copied' ? 'Copied!' : label}
      </span>
    </div>
  );
}

/* ── Size preview strip ─────────────────────────────────────── */
function SizePreview({ paths, label }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
      <span style={{ width: 100, fontSize: 12, color: 'var(--text-muted)' }}>{label}</span>
      {[16, 20, 24, 32, 48].map(s => (
        <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
          <div style={{ color: 'var(--text)' }}><Icon paths={paths} size={s} /></div>
          <span style={{ fontSize: 10, color: 'var(--text-subtle)' }}>{s}</span>
        </div>
      ))}
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────── */
function App() {
  const [dark, setDark]     = React.useState(() => localStorage.getItem('arr-dark') === 'true');
  const [size, setSize]     = React.useState(24);
  const [query, setQuery]   = React.useState('');
  const [view, setView]     = React.useState('grid');
  const [preview, setPreview] = React.useState(null);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-dark', dark ? '' : null);
    if (dark) document.documentElement.setAttribute('data-dark', '');
    else document.documentElement.removeAttribute('data-dark');
    localStorage.setItem('arr-dark', dark);
  }, [dark]);

  const q = query.toLowerCase();
  const allIcons = Object.entries(ICONS).flatMap(([cat, icons]) =>
    icons.map(([id, label, paths]) => ({ id, label, paths, cat }))
  );
  const filtered = q
    ? allIcons.filter(i => i.label.toLowerCase().includes(q) || i.id.includes(q))
    : null;

  const totalCount = allIcons.length;

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      {/* ── Header ── */}
      <header style={{
        position: 'sticky', top: 0, zIndex: 100,
        background: 'var(--bg)', borderBottom: '1px solid var(--border)',
        padding: '0 32px', height: 60,
        display: 'flex', alignItems: 'center', gap: 20,
      }}>
        <a href="Design System.html" style={{ textDecoration: 'none' }}>
          <img src="uploads/logo.png" alt="Arroba" style={{ height: 20, filter: dark ? 'invert(1)' : 'none', opacity: .85 }} />
        </a>
        <div style={{ width: 1, height: 20, background: 'var(--border)' }}></div>
        <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', fontFamily: 'Syne, sans-serif' }}>Icons</span>
        <span style={{ fontSize: 12, color: 'var(--text-subtle)', background: 'var(--surface-2)', padding: '2px 8px', borderRadius: 4, border: '1px solid var(--border)' }}>{totalCount} iconos</span>

        <div style={{ flex: 1 }}></div>

        {/* Search */}
        <div style={{ position: 'relative' }}>
          <div style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-subtle)', pointerEvents: 'none', display: 'flex' }}>
            <Icon paths='<circle cx="11" cy="11" r="7.5"/><line x1="16.5" y1="16.5" x2="21.5" y2="21.5"/>' size={14} />
          </div>
          <input value={query} onChange={e => setQuery(e.target.value)}
            placeholder="Buscar icono..."
            style={{
              padding: '7px 12px 7px 32px', borderRadius: 8, border: '1px solid var(--border-strong)',
              background: 'var(--surface)', color: 'var(--text)', fontSize: 13, outline: 'none', width: 200,
            }}
          />
        </div>

        {/* Size */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 12, color: 'var(--text-muted)', width: 24 }}>{size}px</span>
          <input type="range" min={16} max={48} step={4} value={size} onChange={e => setSize(+e.target.value)}
            style={{ width: 80, accentColor: '#E8001D' }}
          />
        </div>

        {/* View toggle */}
        <div style={{ display: 'flex', borderRadius: 8, overflow: 'hidden', border: '1px solid var(--border)' }}>
          {[['grid','⊞'],['list','≡']].map(([v, icon]) => (
            <button key={v} onClick={() => setView(v)} style={{
              padding: '6px 12px', border: 'none', cursor: 'pointer', fontSize: 14,
              background: view === v ? '#E8001D' : 'var(--surface)',
              color: view === v ? '#fff' : 'var(--text-muted)',
            }}>{icon}</button>
          ))}
        </div>

        {/* Dark mode */}
        <button onClick={() => setDark(!dark)} style={{
          padding: '6px 12px', borderRadius: 8, border: '1px solid var(--border)',
          background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer', fontSize: 14,
        }}>{dark ? '☀' : '◑'}</button>
      </header>

      <div style={{ maxWidth: 1100, margin: '0 auto', padding: '40px 32px 80px' }}>

        {/* ── Search results ── */}
        {filtered ? (
          <div>
            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 20 }}>
              {filtered.length} resultado{filtered.length !== 1 ? 's' : ''} para <strong style={{ color: 'var(--text)' }}>"{query}"</strong>
            </div>
            <div style={view === 'grid' ? {
              display: 'grid', gridTemplateColumns: `repeat(auto-fill, minmax(${Math.max(80, size + 40)}px, 1fr))`, gap: 10,
            } : { display: 'flex', flexDirection: 'column', gap: 0 }}>
              {filtered.map(({ id, label, paths }) => (
                <IconCard key={id} id={id} label={label} paths={paths} size={size} view={view} />
              ))}
            </div>
          </div>

        ) : (
          <>
            {/* ── Size showcase ── */}
            {!preview && (
              <div style={{ marginBottom: 48 }}>
                <h2 style={{ fontFamily: 'Syne, sans-serif', fontSize: 20, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>Escala de tamaños</h2>
                <p style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 20 }}>Todos los iconos están definidos en 24×24. Escalan limpiamente a 16, 20, 32 y 48px.</p>
                <div style={{ background: 'var(--surface)', borderRadius: 12, border: '1px solid var(--border)', padding: '8px 20px' }}>
                  {[
                    ['search', 'Search', ICONS['Core UI'][0][2]],
                    ['agency', 'Agencia', ICONS['Marketplace M&A'][0][2]],
                    ['chart-bar', 'Chart Bar', ICONS['Datos & Finanzas'][0][2]],
                    ['verified', 'Verificado', ICONS['Marketplace M&A'][4][2]],
                  ].map(([id, label, paths]) => (
                    <SizePreview key={id} paths={paths} label={label} />
                  ))}
                </div>
              </div>
            )}

            {/* ── Categories ── */}
            {Object.entries(ICONS).map(([cat, icons]) => (
              <div key={cat} style={{ marginBottom: 48 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
                  <h2 style={{ fontFamily: 'Syne, sans-serif', fontSize: 18, fontWeight: 700, color: 'var(--text)' }}>{cat}</h2>
                  <span style={{ fontSize: 11, color: 'var(--text-subtle)', background: 'var(--surface-2)', padding: '2px 8px', borderRadius: 4, border: '1px solid var(--border)' }}>{icons.length}</span>
                </div>
                <div style={view === 'grid' ? {
                  display: 'grid',
                  gridTemplateColumns: `repeat(auto-fill, minmax(${Math.max(80, size + 40)}px, 1fr))`,
                  gap: 10,
                } : {
                  display: 'flex', flexDirection: 'column', gap: 0,
                  border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden',
                  background: 'var(--surface)',
                }}>
                  {icons.map(([id, label, paths]) => (
                    <IconCard key={id} id={id} label={label} paths={paths} size={size} view={view} />
                  ))}
                </div>
              </div>
            ))}
          </>
        )}

        {/* ── Usage footer ── */}
        <div style={{ borderTop: '1px solid var(--border)', paddingTop: 32, marginTop: 20 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)', marginBottom: 10 }}>Uso en React</div>
          <pre style={{
            background: '#0C0C0E', color: '#F4F4F0', borderRadius: 10, padding: '20px',
            fontSize: 12, lineHeight: 1.7, overflowX: 'auto', fontFamily: 'monospace',
            border: '1px solid #2E2E2C',
          }}>{`// Click en cualquier icono para copiar su JSX

// Componente Icon base
function Icon({ paths, size = 24, strokeWidth = 1.75, color = 'currentColor' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      dangerouslySetInnerHTML={{ __html: paths }}
    />
  );
}

// Uso
import { ICONS } from './arroba-icons';
<Icon paths={ICONS.search} size={20} />
<Icon paths={ICONS.agency} size={24} color="var(--primary)" />`}
          </pre>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
