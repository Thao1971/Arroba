<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iconos Copilot — arroba.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --red:#E8001D; --red-deep:#8E0016; --red-bright:#FF2A45; --gold:#FFC24A;
    --bg:#FAFAF8; --surface:#FFFFFF; --border:#E8E8E2; --text:#0C0C0E; --muted:#636360; --subtle:#ADADAA;
  }
  [data-dark]{ --bg:#0C0C0E; --surface:#16161A; --border:#2A2A2E; --text:#FAFAF8; --muted:#ADADAA; --subtle:#6B6B68; }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:48px 28px 90px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:15px;color:var(--muted);margin-top:6px;max-width:620px;line-height:1.55}
  .toggle{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:15px;flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px 22px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .stage{height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;cursor:pointer;perspective:600px}
  .num{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
  .name{font-size:16px;font-weight:700;font-family:'Space Grotesk';margin-bottom:5px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .hint{display:inline-flex;align-items:center;gap:7px;margin-top:26px;font-size:12.5px;color:var(--subtle);background:var(--surface);border:1px solid var(--border);padding:7px 14px;border-radius:999px}
  .hint b{color:var(--red)}

  /* ============ 1 · LAZO PLANO (actual) ============ */
  .ic1 svg{display:block;transition:filter .25s}
  .ic1 .g2{opacity:0;transition:opacity .3s}
  .stage:hover .ic1 svg{filter:drop-shadow(0 0 8px rgba(255,170,40,.7))}
  .stage:hover .ic1 .g2{opacity:1}

  /* ============ 2 · DISCO 3D (extrusión) ============ */
  .ic2{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .stage:hover .ic2{transform:rotateX(18deg) rotateY(-12deg) translateY(-4px)}
  .ic2 .face{transition:filter .3s}
  .stage:hover .ic2 .face{filter:drop-shadow(0 8px 14px rgba(232,0,29,.4))}

  /* ============ 3 · ANILLO NEÓN ============ */
  .ic3 .ring{transition:filter .3s, stroke-width .3s}
  .ic3 .spark{opacity:0;transition:opacity .3s;transform-origin:center}
  .stage:hover .ic3 .ring{filter:drop-shadow(0 0 4px var(--red)) drop-shadow(0 0 10px rgba(232,0,29,.6))}
  .stage:hover .ic3 .spark{opacity:1;animation:spin3 5s linear infinite}
  @keyframes spin3{to{transform:rotate(360deg)}}

  /* ============ 4 · CRISTAL BISELADO ============ */
  .ic4{transition:transform .3s}
  .stage:hover .ic4{transform:translateY(-5px) scale(1.05)}
  .ic4 .sheen{transform:translateX(-40px);opacity:0;transition:transform .5s, opacity .4s}
  .stage:hover .ic4 .sheen{transform:translateX(40px);opacity:.85}

  /* ============ 5 · TRAZO QUE FLUYE ============ */
  .ic5 .flow{stroke-dasharray:7 120;stroke-dashoffset:0;opacity:0;transition:opacity .25s}
  .stage:hover .ic5 .flow{opacity:1;animation:dash5 1.6s linear infinite}
  @keyframes dash5{to{stroke-dashoffset:-127}}
  .ic5{transition:transform .3s}
  .stage:hover .ic5{transform:scale(1.06)}

  /* ============ 6 · ESFERA / PASTILLA ============ */
  .ic6 .orb{transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s}
  .stage:hover .ic6 .orb{transform:translateY(-5px)}
  .ic6 .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0}
  .stage:hover .ic6 .pulse{animation:pulse6 1.4s ease-out infinite}
  @keyframes pulse6{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Iconos del copilot</h1>
      <p class="sub">Seis alternativas del símbolo «@» en rojo arroba con sensación 3D / profundidad. Pasa el ratón por encima de cada uno para ver su efecto de activación. Dime cuál te convence (o qué mezclar).</p>
    </div>
    <button class="toggle" id="tg" title="Tema">◑</button>
  </div>

  <div class="grid" id="grid"></div>

  <div style="text-align:center"><span class="hint">Pasa el ratón sobre cada icono · <b>hover</b> para ver el efecto</span></div>
</div>

<script>
// gradiente carmesí→cereza reutilizable
function defs(id){
  return '<defs>'+
    '<linearGradient id="g'+id+'" x1="6" y1="4" x2="30" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#FF2A45"/><stop offset=".55" stop-color="#E8001D"/><stop offset="1" stop-color="#8E0016"/></linearGradient>'+
    '<linearGradient id="gold'+id+'" x1="6" y1="4" x2="30" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD56A"/><stop offset=".5" stop-color="#FF5A3C"/><stop offset="1" stop-color="#E8001D"/></linearGradient>'+
    '<radialGradient id="sph'+id+'" cx="38%" cy="32%" r="75%"><stop stop-color="#FF5566"/><stop offset="45%" stop-color="#E8001D"/><stop offset="100%" stop-color="#8E0016"/></radialGradient>'+
    '<linearGradient id="bev'+id+'" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#FF3D54"/><stop offset="1" stop-color="#C00018"/></linearGradient>'+
  '</defs>';
}
// path del @ (lazo)
var AT = '<circle cx="18" cy="18" r="4.7"/><path d="M22.7 13.6 V20.2 C22.7 22.7 24.6 23.6 26.8 22.5"/><path d="M26.9 11.9 A11 11 0 1 0 28.1 24.6"/>';

var icons = [
  { n:'01', name:'Lazo plano', desc:'El actual. Cinta con gradiente; en hover, glow oro-rojo y capa dorada.',
    svg:'<div class="ic1"><svg width="72" height="72" viewBox="0 0 36 36" fill="none">'+defs('1')+
      '<g stroke="url(#g1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
      '<g class="g2" stroke="url(#gold1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
    '</svg></div>' },

  { n:'02', name:'Disco 3D', desc:'@ recortado sobre un disco extruido. En hover gira en perspectiva con sombra de color.',
    svg:'<div class="ic2" style="transform-style:preserve-3d"><svg class="face" width="74" height="74" viewBox="0 0 36 36" fill="none">'+defs('2')+
      '<circle cx="18" cy="19.2" r="14" fill="#8E0016"/>'+      /* canto inferior (extrusión) */
      '<circle cx="18" cy="18" r="14" fill="url(#bev2)"/>'+
      '<g stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".96">'+AT+'</g>'+
    '</svg></div>' },

  { n:'03', name:'Anillo neón', desc:'Lazo luminoso. En hover intensifica el neón y orbita una chispa.',
    svg:'<div class="ic3"><svg width="74" height="74" viewBox="0 0 36 36" fill="none">'+defs('3')+
      '<g class="ring" stroke="url(#g3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
      '<g class="spark"><circle cx="18" cy="3.6" r="1.9" fill="#FFC24A"/></g>'+
    '</svg></div>' },

  { n:'04', name:'Cristal biselado', desc:'@ en cristal rojo con bisel y brillo. En hover lo cruza un reflejo (sheen).',
    svg:'<div class="ic4"><svg width="74" height="74" viewBox="0 0 36 36" fill="none">'+defs('4')+
      '<rect x="3" y="3" width="30" height="30" rx="9" fill="url(#bev4)"/>'+
      '<rect x="3" y="3" width="30" height="15" rx="9" fill="#fff" opacity=".14"/>'+
      '<g stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
      '<rect class="sheen" x="-6" y="3" width="10" height="30" rx="5" fill="#fff" opacity=".5"/>'+
    '</svg></div>' },

  { n:'05', name:'Trazo que fluye', desc:'Cinta fina y elegante. En hover, un haz de luz recorre el trazo (flujo de datos).',
    svg:'<div class="ic5"><svg width="74" height="74" viewBox="0 0 36 36" fill="none">'+defs('5')+
      '<g stroke="url(#g5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
      '<g class="flow" stroke="#FFD56A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g>'+
    '</svg></div>' },

  { n:'06', name:'Esfera', desc:'@ blanco sobre esfera roja con luz superior. En hover flota y emite un pulso.',
    svg:'<div class="ic6" style="position:relative;width:70px;height:70px"><div class="orb" style="width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 30%, #FF5566, #E8001D 46%, #8E0016 100%);box-shadow:0 10px 22px rgba(232,0,29,.4), inset 0 2px 6px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center">'+
      '<svg width="42" height="42" viewBox="0 0 36 36" fill="none"><g stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+AT+'</g></svg>'+
      '<span class="pulse"></span></div></div>' },
];

var grid = document.getElementById('grid');
grid.innerHTML = icons.map(function(i){
  return '<div class="card"><div class="stage">'+i.svg+'</div>'+
    '<div class="num">Opción '+i.n+'</div><div class="name">'+i.name+'</div><div class="desc">'+i.desc+'</div></div>';
}).join('');

document.getElementById('tg').onclick = function(){
  document.documentElement.toggleAttribute('data-dark');
};
</script>
</body>
</html>
