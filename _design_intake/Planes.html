<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planes — arroba.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAF8; --surface: #FFFFFF; --surface-2: #F4F4F0;
      --border: #E8E8E2; --border-strong: #D4D4CC;
      --text: #0C0C0E; --text-muted: #636360; --text-subtle: #ADADAA;
      --primary: #E8001D;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }
    [data-dark] {
      --bg: #0C0C0E; --surface: #1A1A18; --surface-2: #242422;
      --border: #2E2E2C; --border-strong: #4A4A47;
      --text: #FAFAF8; --text-muted: #ADADAA; --text-subtle: #7A7A75;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    html { scroll-behavior: smooth; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    * { transition: background-color .15s, border-color .12s, color .1s; }
    @media (max-width: 880px) {
      .pl-cards, .pl-fees-grid, .pl-shared-grid, .pl-band-grid, .pl-credits { grid-template-columns: 1fr !important; }
      .pl-band-grid > div { border-left: none !important; padding: 18px 0 !important; border-top: 1px solid rgba(255,255,255,.1); }
      .pl-cards > div { transform: none !important; }
      .pl-nav-links, .pl-hide-sm { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="planes/pl-data.js"></script>
  <script type="text/babel" src="home/home-charts.jsx"></script>
  <script type="text/babel" src="planes/pl-sections.jsx"></script>
  <script type="text/babel" src="planes/pl-app.jsx"></script>
  <script src="assets/arroba-copilot.js"></script>
</body>
</html>
