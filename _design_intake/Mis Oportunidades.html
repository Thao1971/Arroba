<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mis oportunidades — arroba.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAF8; --surface: #FFFFFF; --surface-2: #F4F4F0;
      --border: #E8E8E2; --border-strong: #D4D4CC;
      --text: #0C0C0E; --text-muted: #636360; --text-subtle: #ADADAA;
      --primary: #E8001D;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }
    [data-dark] {
      --bg: #0C0C0E; --surface: #1A1A18; --surface-2: #242422;
      --border: #2E2E2C; --border-strong: #4A4A47;
      --text: #FAFAF8; --text-muted: #ADADAA; --text-subtle: #636360;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    @keyframes opLive { 0% { transform: scale(1); opacity: .7; } 75%, 100% { transform: scale(2.6); opacity: 0; } }
    * { transition: background-color .15s, border-color .12s, color .1s; }
    /* Layout universal de 3 columnas → responsive */
    @media (max-width: 1160px) {
      .wb-grid { grid-template-columns: minmax(180px, 1fr) minmax(0, 3fr) !important; }
      .wb-copilotrail { display: none !important; }
    }
    @media (max-width: 860px) {
      .wb-grid { grid-template-columns: 1fr !important; }
      .wb-leftrail { position: static !important; max-height: none !important; display: none !important; }
      .wb-oppgrid { grid-template-columns: 1fr !important; }
      .wb-nav, .wb-cmdk { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="opportunity/wb-data.js"></script>
  <script type="text/babel" src="opportunity/op-components.jsx"></script>
  <script type="text/babel" src="opportunity/wb-rails.jsx"></script>
  <script type="text/babel" src="opportunity/wb-cards.jsx"></script>
  <script type="text/babel" src="opportunity/wb-app.jsx"></script>
  <script src="assets/arroba-copilot.js"></script>
</body>
</html>
