<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grupo Olmedo Hoteles — Empresa · arroba.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAF8; --surface: #FFFFFF; --surface-2: #F4F4F0;
      --border: #E8E8E2; --border-strong: #D4D4CC;
      --text: #0C0C0E; --text-muted: #636360; --text-subtle: #ADADAA;
      --primary: #E8001D;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
    }
    [data-dark] {
      --bg: #0C0C0E; --surface: #1A1A18; --surface-2: #242422;
      --border: #2E2E2C; --border-strong: #4A4A47;
      --text: #FAFAF8; --text-muted: #ADADAA; --text-subtle: #636360;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    * { transition: background-color .15s, border-color .12s, color .1s; }
    .ce-navitem { background: transparent; }
    .ce-navitem:not(.is-active):hover { background: var(--surface-2) !important; }
    @keyframes advBounce { 0%,80%,100% { transform: translateY(0); opacity:.4; } 40% { transform: translateY(-4px); opacity:1; } }
    .adv-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-subtle); display: inline-block; animation: advBounce 1s infinite ease-in-out; }
    @keyframes dealPulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.4; transform: scale(.8); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="company/cp-data.js"></script>
  <script src="company/ce-data.js"></script>
  <script type="text/babel" src="company/cp-charts.jsx"></script>
  <script type="text/babel" src="company/ce-advisor.jsx"></script>
  <script type="text/babel" src="company/ce-deal.jsx"></script>
  <script type="text/babel" src="company/ce-sections1.jsx"></script>
  <script type="text/babel" src="company/ce-sections2.jsx"></script>
  <script type="text/babel" src="company/ce-sections3.jsx"></script>
  <script type="text/babel" src="company/ce-app.jsx"></script>
  <script src="assets/arroba-copilot.js"></script>
</body>
</html>
