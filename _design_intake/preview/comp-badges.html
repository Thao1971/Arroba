<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg); padding: 20px; font-family: var(--font-body); }
  .section-title { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .divider { border: none; border-top: 1px solid var(--border-subtle); margin: 12px 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    padding: 3px 9px; border-radius: var(--radius-full);
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

  /* Stage badges */
  .b-new       { background: oklch(0.66 0.11 232 / 0.12); color: oklch(0.66 0.11 232); }
  .b-nda       { background: oklch(0.76 0.12 52  / 0.12); color: oklch(0.76 0.12 52); }
  .b-dd        { background: oklch(0.78 0.14 85  / 0.14); color: oklch(0.78 0.14 85); }
  .b-closed    { background: oklch(0.67 0.13 150 / 0.12); color: oklch(0.67 0.13 150); }
  .b-rejected  { background: oklch(0.61 0.17 22  / 0.12); color: oklch(0.61 0.17 22); }
  .b-neutral   { background: var(--surface-3); color: var(--text-2); }

  /* Type tags */
  .tag {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: var(--radius-sm);
    background: var(--surface-3); color: var(--text-2);
    border: 1px solid var(--border-default);
  }

  /* Pipeline stepper */
  .stepper { display: flex; align-items: center; gap: 0; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; }
  .step-line { width: 32px; height: 1px; margin-top: -13px; }
  .step-label { font-size: 9px; color: var(--text-3); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="section-title">Estados de Deal</div>
  <div class="row">
    <span class="badge b-new"><span class="dot" style="background:oklch(0.66 0.11 232)"></span>Nuevo</span>
    <span class="badge b-nda"><span class="dot" style="background:oklch(0.76 0.12 52)"></span>NDA firmada</span>
    <span class="badge b-dd"><span class="dot" style="background:oklch(0.78 0.14 85)"></span>Due diligence</span>
    <span class="badge b-closed"><span class="dot" style="background:oklch(0.67 0.13 150)"></span>Cerrado</span>
    <span class="badge b-rejected"><span class="dot" style="background:oklch(0.61 0.17 22)"></span>Rechazado</span>
    <span class="badge b-neutral"><span class="dot" style="background:var(--text-3)"></span>En pausa</span>
  </div>

  <hr class="divider">
  <div class="section-title">Etiquetas de Categoría</div>
  <div class="row">
    <span class="tag">Performance</span>
    <span class="tag">SEO</span>
    <span class="tag">Paid Media</span>
    <span class="tag">Creative</span>
    <span class="tag">Data &amp; Analytics</span>
    <span class="tag">MarTech</span>
    <span class="tag">eCommerce</span>
  </div>

  <hr class="divider">
  <div class="section-title">Pipeline — Fases</div>
  <div class="stepper">
    <div class="step">
      <div class="step-dot" style="background:oklch(0.67 0.13 150)"></div>
      <div class="step-label">Interés</div>
    </div>
    <div class="step-line" style="background:var(--border-strong)"></div>
    <div class="step">
      <div class="step-dot" style="background:oklch(0.67 0.13 150)"></div>
      <div class="step-label">NDA</div>
    </div>
    <div class="step-line" style="background:var(--border-strong)"></div>
    <div class="step">
      <div class="step-dot" style="background:oklch(0.76 0.12 52)"></div>
      <div class="step-label">Info pack</div>
    </div>
    <div class="step-line" style="background:var(--border-subtle)"></div>
    <div class="step">
      <div class="step-dot" style="background:var(--border-default)"></div>
      <div class="step-label">DD</div>
    </div>
    <div class="step-line" style="background:var(--border-subtle)"></div>
    <div class="step">
      <div class="step-dot" style="background:var(--border-default)"></div>
      <div class="step-label">LOI</div>
    </div>
    <div class="step-line" style="background:var(--border-subtle)"></div>
    <div class="step">
      <div class="step-dot" style="background:var(--border-default)"></div>
      <div class="step-label">Cierre</div>
    </div>
  </div>
</body>
</html>
