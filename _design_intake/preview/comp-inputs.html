<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg); padding: 20px; font-family: var(--font-body); }
  .section-title { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  .divider { border: none; border-top: 1px solid var(--border-subtle); margin: 14px 0; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

  .field-wrap { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: 0.02em; }
  .field {
    background: var(--surface-2); border: 1px solid var(--border-default);
    border-radius: var(--radius-md); color: var(--text-1);
    font-family: var(--font-body); font-size: 13px;
    padding: 0 12px; height: 36px; width: 180px; outline: none;
    transition: border-color 120ms ease-out;
  }
  .field::placeholder { color: var(--text-4); }
  .field:focus { border-color: oklch(0.76 0.12 52 / 0.6); box-shadow: 0 0 0 2px oklch(0.76 0.12 52 / 0.12); }
  .field-error { border-color: oklch(0.61 0.17 22 / 0.6) !important; }
  .field-hint  { font-size: 11px; color: var(--text-3); }
  .field-hint.error { color: oklch(0.61 0.17 22); }

  .select {
    background: var(--surface-2); border: 1px solid var(--border-default);
    border-radius: var(--radius-md); color: var(--text-1);
    font-family: var(--font-body); font-size: 13px;
    padding: 0 28px 0 12px; height: 36px; width: 180px;
    outline: none; appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235e5c5a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center;
  }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-1); }
  .checkbox { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface-2); appearance: none; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .checkbox:checked { background: oklch(0.76 0.12 52); border-color: oklch(0.76 0.12 52); }
  .checkbox:checked::after { content: '✓'; font-size: 10px; color: #0a0a0a; font-weight: 700; }
</style>
</head>
<body>
  <div class="section-title">Inputs de Formulario</div>
  <div class="row">
    <div class="field-wrap">
      <label class="field-label">Nombre de la agencia</label>
      <input class="field" type="text" placeholder="Ej. Mediacloud SL">
    </div>
    <div class="field-wrap">
      <label class="field-label">Facturación anual</label>
      <input class="field" type="text" placeholder="€ 0" style="font-family:'JetBrains Mono',monospace">
    </div>
    <div class="field-wrap">
      <label class="field-label">Estado (con error)</label>
      <input class="field field-error" type="text" value="dato incorrecto">
      <span class="field-hint error">Formato no válido</span>
    </div>
  </div>

  <hr class="divider">
  <div class="section-title">Select & Checkbox</div>
  <div class="row" style="align-items:flex-start">
    <div class="field-wrap">
      <label class="field-label">Tipo de operación</label>
      <select class="select"><option>Venta total</option><option>Venta parcial</option><option>Partnership</option></select>
    </div>
    <div class="field-wrap" style="justify-content:flex-end;padding-top:20px">
      <label class="checkbox-row"><input type="checkbox" class="checkbox" checked>Acepto la NDA</label>
      <label class="checkbox-row" style="margin-top:8px"><input type="checkbox" class="checkbox">Notificaciones por email</label>
    </div>
  </div>
</body>
</html>
