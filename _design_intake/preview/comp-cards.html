<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--surface-1); padding: 20px; font-family: var(--font-body); display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }

  .card {
    background: var(--surface-2); border: 1px solid var(--border-default);
    border-radius: var(--radius-xl); padding: 16px;
    transition: border-color 180ms ease-out;
  }
  .card:hover { border-color: var(--border-strong); }

  /* Deal card */
  .deal-card { width: 220px; }
  .deal-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: var(--radius-full); margin-bottom: 10px; }
  .deal-name { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--text-1); margin-bottom: 2px; letter-spacing: -0.01em; }
  .deal-sub  { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
  .deal-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .deal-metric-label { font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
  .deal-metric-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-1); font-weight: 500; }

  /* Stat card */
  .stat-card { width: 110px; }
  .stat-label { font-size: 10px; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: var(--text-1); font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .stat-change { font-size: 11px; margin-top: 4px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; border-radius: var(--radius-full); }
  .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <!-- Deal listing card -->
  <div class="card deal-card">
    <div class="deal-tag" style="background:oklch(0.76 0.12 52 / 0.12);color:oklch(0.76 0.12 52)">
      <span class="dot" style="background:oklch(0.76 0.12 52)"></span>En proceso
    </div>
    <div class="deal-name">Agencia Nómada</div>
    <div class="deal-sub">Performance · SEO · Paid</div>
    <div class="deal-metrics">
      <div><div class="deal-metric-label">Valoración</div><div class="deal-metric-val">€2.4M</div></div>
      <div><div class="deal-metric-label">MRR</div><div class="deal-metric-val">€120k</div></div>
      <div><div class="deal-metric-label">EBITDA</div><div class="deal-metric-val">+38%</div></div>
      <div><div class="deal-metric-label">Equipo</div><div class="deal-metric-val">14</div></div>
    </div>
  </div>

  <!-- Stats card -->
  <div class="card stat-card">
    <div class="stat-label">Deals activos</div>
    <div class="stat-val">24</div>
    <div class="stat-change" style="color:oklch(0.67 0.13 150)">↑ +3 este mes</div>
  </div>

  <div class="card stat-card">
    <div class="stat-label">Volumen total</div>
    <div class="stat-val">€47M</div>
    <div class="stat-change" style="color:oklch(0.76 0.12 52)">↑ +12%</div>
  </div>

  <div class="card stat-card">
    <div class="stat-label">Tiempo medio</div>
    <div class="stat-val">64d</div>
    <div class="stat-change" style="color:var(--text-3)">cierre deal</div>
  </div>
</body>
</html>
