<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg); padding: 24px 20px 16px; font-family: var(--font-body); }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; }
  .row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .meta { width: 80px; flex-shrink: 0; }
  .meta-size { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
  .meta-role { font-size: 9px; color: var(--text-4); font-family: var(--font-mono); }
  .specimen { font-family: var(--font-display); font-weight: 600; color: var(--text-1); letter-spacing: -0.02em; line-height: 1; }
</style>
</head>
<body>
  <div class="row"><div class="meta"><div class="meta-size">60px</div><div class="meta-role">--h1 display</div></div><div class="specimen" style="font-size:60px">Arroba</div></div>
  <div class="row"><div class="meta"><div class="meta-size">48px</div><div class="meta-role">--h1</div></div><div class="specimen" style="font-size:48px">Deal Flow</div></div>
  <div class="row"><div class="meta"><div class="meta-size">38px</div><div class="meta-role">--h2</div></div><div class="specimen" style="font-size:38px">€2.4M Valoración</div></div>
  <div class="row"><div class="meta"><div class="meta-size">30px</div><div class="meta-role">--h3</div></div><div class="specimen" style="font-size:30px">Agencia en venta</div></div>
  <div class="row"><div class="meta"><div class="meta-size">24px</div><div class="meta-role">--h4</div></div><div class="specimen" style="font-size:24px">Métricas clave</div></div>
  <div class="row"><div class="meta"><div class="meta-size">20px</div><div class="meta-role">--h5</div></div><div class="specimen" style="font-size:20px">Resumen ejecutivo</div></div>
</body>
</html>
