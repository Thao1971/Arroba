<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body {
    background: var(--bg); padding: 28px 32px;
    font-family: var(--font-body);
    display: flex; align-items: center; gap: 48px;
  }

  /* Logo — real asset */
  .logo-real img { image-rendering: auto; height: 40px; width: auto; }

  .divider-v { width: 1px; background: var(--border-default); align-self: stretch; }

  /* Logo mark text fallback */
  .logo-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text-1);
  }
  .logo-mark .slash { color: oklch(0.58 0.20 22); }

  /* Variations */
  .variations { display: flex; flex-direction: column; gap: 14px; }
  .var-row { display: flex; align-items: center; gap: 12px; }
  .var-label { font-size: 9px; font-family: var(--font-mono); color: var(--text-3); width: 52px; flex-shrink: 0; letter-spacing: 0.06em; }

  .on-dark  { background: var(--bg); padding: 8px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-default); }
  .on-light { background: #f5f4f1; padding: 8px 14px; border-radius: var(--radius-md); }
  .on-light .logo-mark { color: #111; }
  .on-light .logo-mark .slash { color: oklch(0.52 0.22 22); }

  .sm .logo-mark { font-size: 14px; }

  .usage { margin-top: 4px; font-size: 10px; color: var(--text-3); line-height: 1.6; }
  .usage strong { color: var(--text-2); }
</style>
</head>
<body>
  <div class="logo-real">
    <img src="../assets/logo.png" alt="Arroba logo">
    <div class="usage" style="margin-top:12px">
      <strong>Formato:</strong> PNG 106×35px · transparente<br>
      ⚠️ Solicitar SVG para escalabilidad
    </div>
  </div>

  <div class="divider-v"></div>

  <div class="variations">
    <div class="var-row">
      <span class="var-label">dark bg</span>
      <div class="on-dark">
        <span class="logo-mark"><span class="slash">/.</span>rrob<span class="slash">.\</span></span>
      </div>
    </div>
    <div class="var-row">
      <span class="var-label">light bg</span>
      <div class="on-light">
        <span class="logo-mark"><span class="slash">/.</span>rrob<span class="slash">.\</span></span>
      </div>
    </div>
    <div class="var-row sm">
      <span class="var-label">small</span>
      <div class="on-dark">
        <span class="logo-mark"><span class="slash">/.</span>rrob<span class="slash">.\</span></span>
      </div>
    </div>
  </div>
</body>
</html>
